# Rehearsal of release.yml with a throwaway image (JAY-110 4.3). Delete before merging.
name: Dry run
on:
  push:
    branches: [jay-110-bee-build-pearl-deploy]
    paths: ['dryrun/**']
jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      project: dryrun
      context: dryrun
      test-command: 'docker image inspect "$IMAGE" >/dev/null && echo test-ok'
